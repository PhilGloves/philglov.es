# One workflow for pull requests and main. Order (docs/guide.md, Lead prompt 5):
#   lint → typecheck → build → unit → e2e → Lighthouse → deploy
# There is no translation step: both languages are written by hand.
# Deploy jobs are switched on with repository variables once docs/setup.md
# is done: PREVIEW_DEPLOY, STAGING_DEPLOY, and PRODUCTION_DEPLOY (at launch).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PNPM_VERSION: 12.18.0
  ASTRO_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

# An explicit `shell: bash` makes GitHub run every step with `-eo pipefail`, so a
# failing command piped into `tee` fails its step. The implicit default shell
# (`bash -e`) has no pipefail: a failed preview upload once reported success.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install -g "pnpm@$PNPM_VERSION"
      - name: Locate pnpm store
        id: pnpm
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

      # Photo originals come from the private R2 bucket; resized outputs are
      # cached by file hash so build time grows only with new photos.
      - name: Restore photo caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/.originals
            node_modules/.astro
          key: photos-${{ hashFiles('src/content/photos/**/photos.json', 'src/content/journal/**/*.md') }}
          restore-keys: photos-
      - name: Fetch photo originals from R2
        if: ${{ hashFiles('scripts/fetch-originals.ts') != '' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_ORIGINALS_BUCKET }}
        run: node scripts/fetch-originals.ts

      # The build draws the share images with headless Chromium (scripts/share-images.ts),
      # so the browser must be installed before it, not only before the e2e tests.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm build
      - name: Validate HTML
        run: pnpm validate:html
      - name: Unit tests
        run: pnpm test:unit
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Lighthouse CI
        id: lighthouse
        run: pnpm test:lighthouse
      # Pass or fail, write each run's scores and timings to the job summary so
      # a budget failure can be read without downloading the reports. Each URL
      # runs 3 times and is judged on the median (lighthouserc.json, 0013).
      - name: Lighthouse summary
        if: ${{ !cancelled() && steps.lighthouse.outcome != 'skipped' }}
        run: |
          echo "Budgets are judged on the median of the 3 runs per page (decision 0013). Every run:" >> "$GITHUB_STEP_SUMMARY"
          for f in .lighthouseci/lhr-*.json; do
            [ -e "$f" ] || continue
            node -e '
              const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              const ms = (id) => Math.round(r.audits[id]?.numericValue ?? NaN);
              const cats = Object.values(r.categories).map((c) => `${c.id} ${c.score}`).join(", ");
              console.log(`${r.finalDisplayedUrl}: ${cats}; FCP ${ms("first-contentful-paint")} ms, LCP ${ms("largest-contentful-paint")} ms, SI ${ms("speed-index")} ms, TBT ${ms("total-blocking-time")} ms, TTFB ${ms("server-response-time")} ms, CLS ${r.audits["cumulative-layout-shift"]?.numericValue}`);
            ' "$f" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-reports
          path: |
            test-results/
            playwright-report/
            .lighthouseci/
          # .lighthouseci/ is a hidden folder, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # One preview URL per pull request on the philglov-preview Worker, which has
  # its own database. Never bound to production data.
  deploy-preview:
    name: Deploy preview
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      vars.PREVIEW_DEPLOY == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install -g "pnpm@$PNPM_VERSION"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Apply database migrations
        if: ${{ hashFiles('worker/migrations/*.sql') != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply DB --env preview --remote
      - name: Upload preview version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pnpm exec wrangler versions upload --env preview --preview-alias "pr-$PR_NUMBER" | tee "$RUNNER_TEMP/upload.txt"
          grep -oE 'https://[^ ]+workers\.dev' "$RUNNER_TEMP/upload.txt" | sed 's/^/Preview: /' >> "$GITHUB_STEP_SUMMARY" || true

  # Until launch: main deploys to the private staging Worker on workers.dev.
  deploy-staging:
    name: Deploy staging
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_DEPLOY == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install -g "pnpm@$PNPM_VERSION"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Apply database migrations
        if: ${{ hashFiles('worker/migrations/*.sql') != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply DB --env staging --remote
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env staging

  # Off until launch (docs/setup.md, "At launch"). Rebuilt with
  # SITE_ENV=production so the static files lose X-Robots-Tag: noindex.
  deploy-production:
    name: Deploy production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install -g "pnpm@$PNPM_VERSION"
      - run: pnpm install --frozen-lockfile
      - name: Restore photo caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/.originals
            node_modules/.astro
          key: photos-${{ hashFiles('src/content/photos/**/photos.json', 'src/content/journal/**/*.md') }}
          restore-keys: photos-
      - name: Fetch photo originals from R2
        if: ${{ hashFiles('scripts/fetch-originals.ts') != '' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_ORIGINALS_BUCKET }}
        run: node scripts/fetch-originals.ts
      - name: Install Playwright browsers (the build draws the share images)
        run: pnpm exec playwright install --with-deps chromium
      - name: Build for production
        env:
          SITE_ENV: production
        run: pnpm build
      - name: Apply database migrations
        if: ${{ hashFiles('worker/migrations/*.sql') != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply DB --env production --remote
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env production
